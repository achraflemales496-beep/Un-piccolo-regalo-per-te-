<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Per Beatrice ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="gift-page">

        <div class="stars"></div>

        <section class="intro" id="intro">

            <p class="small-text">Ho preparato una cosa per te...</p>

            <h1>
                Per te,<br>
                <span>Beatrice ❤️</span>
            </h1>

            <div class="envelope-area">

                <button class="envelope-button" id="envelopeButton" aria-label="Apri la busta">

                    <div class="envelope">

                        <div class="envelope-back"></div>

                        <div class="letter">
                            <span>❤️</span>
                        </div>

                        <div class="envelope-front"></div>

                        <div class="envelope-flap"></div>

                    </div>

                </button>

                <p class="tap-text" id="tapText">
                    Tocca la busta
                </p>

            </div>

        </section>


        <section class="message" id="message">

            <div class="heart-animation">❤️</div>

            <p class="message-small">
                Per te ho preparato una piccola sorpresa.
            </p>

            <h2>
                Il nostro<br>
                <span>Capitolo Uno</span>
            </h2>

            <p class="message-text">
                Non è un regalo enorme, ma dentro c'è qualcosa
                che ho fatto pensando a te.
            </p>

            <a
                href="https://progettobeatrice.vercel.app/"
                class="open-button"
            >
                Apri il nostro capitolo
                <span>❤️</span>
            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
